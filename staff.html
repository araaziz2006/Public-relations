<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ستافی مامۆستایان | بەشی پەیوەندییە گشتییەکان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Noto+Kufi+Arabic:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --red:#A82823; --black:#181410; --green:#1C6B45; --gold:#B8892B;
  --paper:#F6F1E6; --paper-2:#EFE7D6; --ink:#2A241C; --ink-soft:#5C5346; --line:rgba(24,20,16,0.14);
}
*{box-sizing:border-box; margin:0; padding:0;}
body{font-family:'Noto Kufi Arabic','Inter',Arial,sans-serif; background:var(--paper); color:var(--ink);}
body.lang-en { font-family:'Inter', Arial, sans-serif; }
a{color:inherit;}

/* Header / Nav */
header{position:sticky; top:0; z-index:50; background:rgba(246,241,230,0.92); backdrop-filter:blur(10px); border-bottom:1px solid var(--line);}
nav{max-width:1180px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; padding:16px 24px; gap:12px; flex-wrap:wrap;}
.brand{display:flex; align-items:center; gap:10px; font-size:17px; font-weight:700; color:var(--black);}
.dept-logo{width:44px; height:44px; border-radius:50%; border:1.5px solid var(--red); background:#fff; object-fit:contain;}
.nav-links{display:flex; gap:20px; list-style:none; flex-wrap:wrap;}
.nav-links a{text-decoration:none; font-weight:600; font-size:13.5px; color:var(--ink-soft); transition:color .2s;}
.nav-links a.active, .nav-links a:hover{color:var(--red);}

/* Language Switcher Button */
.lang-btn {background: var(--black); color: var(--paper); border: 1px solid var(--black); padding: 6px 14px; border-radius: 4px; font-size: 12.5px; font-weight: 700; cursor: pointer; transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 6px;}
.lang-btn:hover {background: var(--red); border-color: var(--red); color: #fff;}
