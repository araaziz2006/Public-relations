<style>
  :root{ --red:#A82823; --black:#181410; --green:#1C6B45; --gold:#B8892B; --paper:#F6F1E6; --paper-2:#EFE7D6; --ink:#2A241C; --ink-soft:#5C5346; --line:rgba(24,20,16,0.14); }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{ font-family:'Noto Kufi Arabic','Inter',Arial,sans-serif; background:var(--paper); color:var(--ink); overflow-x:hidden; }
  header{ position:sticky; top:0; z-index:50; background:rgba(246,241,230,0.92); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
  nav{ max-width:1180px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; padding:16px 24px; }
  .brand{ font-size:17px; font-weight:700; color:var(--black); display:flex; align-items:center; gap:10px; }
  .dept-logo { width: 48px; height: 48px; border-radius: 50%; border: 1.5px solid var(--red); object-fit: contain; background-color: #fff; }
  .hero-wrap{max-width:1180px; margin:0 auto; padding:80px 24px 40px; text-align:center;}
  .hero h1{ font-size:42px; font-weight:900; color:var(--black); margin-bottom:15px; }
  .hero p.lede{ font-size:17px; color:var(--ink-soft); max-width:750px; line-height:1.9; margin:0 auto 40px; }
  .ridge{width:100%; height:70px; display:block; margin-top:20px;}
  .ridge path{fill:none; stroke:var(--black); stroke-width:1.4; opacity:.55;}
  .ridge .fill{fill:var(--red); opacity:.08; stroke:none;}
  section.content{max-width:1180px; margin:0 auto; padding:40px 24px 80px;}
  .grid3{ display:grid; grid-template-columns:repeat(3, 1fr); gap:24px; }
  .nav-card { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 40px 24px; text-align: center; text-decoration: none; color: inherit; transition: transform 0.2s, box-shadow 0.2s; display: block; }
  .nav-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.06); border-color: var(--red); }
  .nav-icon { font-size: 50px; margin-bottom: 20px; }
  .nav-title { font-size: 22px; font-weight: 800; color: var(--black); margin-bottom: 10px; }
  .nav-desc { font-size: 15px; color: var(--ink-soft); line-height: 1.7; }
  
  .contact-section { background-color: #120e0a; color: #ffffff; text-align: center; padding: 60px 24px; border-top: 1px solid rgba(255,255,255,0.1); }
  .contact-section h2 { font-size: 28px; font-weight: 900; margin-bottom: 15px; color:#fff;}
  .contact-section p { font-size: 15px; line-height: 1.8; color: #d4d4d4; max-width: 600px; margin: 0 auto 30px; }
  .contact-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; max-width: 500px; margin: 0 auto; }
  .btn-whatsapp { background-color: #9b2c28; color: #fff; padding: 12px; border-radius: 6px; text-decoration: none; font-weight: 700; transition: 0.2s; }
  .btn-facebook { background-color: transparent; border: 1px solid #fff; color: #fff; padding: 12px; border-radius: 6px; text-decoration: none; font-weight: 700; transition: 0.2s;}
  .btn-instagram { background-color: #f0f0f0; color: #111; padding: 12px; border-radius: 6px; text-decoration: none; font-weight: 700; grid-column: span 2; transition: 0.2s;}
  .btn-map { background-color: transparent; border: 1px solid #fff; color: #fff; padding: 12px; border-radius: 6px; text-decoration: none; font-weight: 700; grid-column: span 2; transition: 0.2s;}
  
  .main-footer { background-color: #0a0805; color: #a3a3a3; text-align: center; padding: 50px 24px; font-size: 13px; line-height: 1.8; }
  .main-footer .copyright { margin-bottom: 15px; font-family: Tahoma, sans-serif;}
  .main-footer .creator { color: #ffffff; font-size: 16px; font-weight: 800; margin-bottom: 15px; line-height: 1.6; }
  .main-footer .acknowledgement { max-width: 700px; margin: 0 auto; color: #7a7a7a; text-align: justify; text-align-last: center; }

  @media (max-width:900px){ .grid3{grid-template-columns: 1fr;} }
  @media (max-width: 600px) { .contact-buttons { grid-template-columns: 1fr; } .btn-instagram, .btn-map { grid-column: span 1; } }
</style>
</head>
